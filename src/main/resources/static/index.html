<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#246b56">
    <title>任务台 · 后端实训</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
<div class="workspace">
    <aside class="sidebar" aria-label="工作区导航">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">✓</span>
            <div><strong>任务台</strong><small>后端实训工作区</small></div>
        </div>
        <nav>
            <a class="nav-link selected" href="#overview" aria-current="page"><span aria-hidden="true">⊞</span> 任务总览</a>
            <a class="nav-link" href="#tasks"><span aria-hidden="true">☷</span> 任务列表</a>
        </nav>
        <div class="sidebar-note">
            <strong>内存存储</strong>
            <p>重启服务后，任务将恢复为启动时的数据。</p>
        </div>
    </aside>

    <main>
        <header class="topbar">
            <span class="current-week">第 01 周</span>
            <span id="health" class="health" role="status">检测服务中</span>
        </header>
        <section id="overview">
            <div class="intro">
                <div>
                    <h1>任务总览</h1>
                    <p>管理本周的 Spring Boot 实训任务与进度。</p>
                </div>
                <button class="primary" id="new-task" type="button"><span aria-hidden="true">＋</span> 新建任务</button>
            </div>
            <div class="metrics" aria-label="任务统计">
                <div class="metric"><span class="metric-icon all" aria-hidden="true">☷</span><div><span>全部任务</span><strong id="total">–</strong></div></div>
                <div class="metric"><span class="metric-icon todo" aria-hidden="true">○</span><div><span>待开始</span><strong id="todo">–</strong></div></div>
                <div class="metric"><span class="metric-icon doing" aria-hidden="true">◷</span><div><span>进行中</span><strong id="doing">–</strong></div></div>
                <div class="metric"><span class="metric-icon done" aria-hidden="true">✓</span><div><span>已完成</span><strong id="done">–</strong></div></div>
            </div>
        </section>

        <div class="content-grid">
            <section class="panel tasks-panel" id="tasks" aria-labelledby="tasks-title">
                <div class="panel-heading">
                    <h2 id="tasks-title">任务列表</h2>
                    <label class="filter-label">状态
                        <select id="filter">
                            <option value="">全部状态</option>
                            <option value="TODO">待开始</option>
                            <option value="IN_PROGRESS">进行中</option>
                            <option value="DONE">已完成</option>
                        </select>
                    </label>
                </div>
                <div class="table-scroll">
                    <table aria-label="任务列表">
                        <thead><tr><th scope="col">任务</th><th scope="col">状态</th><th scope="col">操作</th></tr></thead>
                        <tbody id="task-rows"></tbody>
                    </table>
                </div>
                <p id="table-message" class="table-message" role="status">正在加载任务…</p>
                <div class="list-footer">
                    <span id="visible-count"></span>
                    <button type="button" class="text-button" id="refresh-list">刷新列表</button>
                </div>
            </section>

            <section class="panel progress-panel" aria-labelledby="progress-title">
                <div class="panel-heading"><h2 id="progress-title">完成进度</h2></div>
                <div class="progress-body">
                    <div class="ring" aria-hidden="true"><div><strong id="progress-percent">–</strong><span>完成率</span></div></div>
                    <p id="progress-caption" aria-live="polite">正在统计任务</p>
                    <div class="progress-counts">
                        <span><i></i>已完成</span><strong id="progress-done">–</strong>
                        <span><i></i>未完成</span><strong id="progress-open">–</strong>
                    </div>
                </div>
            </section>
        </div>
        <footer><span>Spring Boot 3 · Task REST API</span><a href="/api/health" target="_blank" rel="noopener">查看健康检查 ↗</a></footer>
    </main>
</div>

<dialog id="task-dialog" aria-labelledby="dialog-title">
    <div class="dialog-heading">
        <h2 id="dialog-title"></h2>
        <button class="close-button" id="close-dialog" type="button" aria-label="关闭">×</button>
    </div>
    <div id="dialog-content"></div>
</dialog>

<template id="task-form-template">
    <form>
        <label>任务名称 <input name="title" required maxlength="80" autofocus></label>
        <label>任务描述 <textarea name="description" rows="4" maxlength="500"></textarea></label>
        <label>状态
            <select name="status" required>
                <option value="TODO">待开始</option>
                <option value="IN_PROGRESS">进行中</option>
                <option value="DONE">已完成</option>
            </select>
        </label>
        <p class="form-error" role="alert" hidden></p>
        <div class="dialog-actions">
            <button class="secondary" type="button" data-close>取消</button>
            <button class="primary" type="submit">保存任务</button>
        </div>
    </form>
</template>
<div class="toast" id="notice" role="status" hidden></div>
</body>
</html>
